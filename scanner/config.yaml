# ── Job Scanner configuration ─────────────────────────────────────────────
# Sources: JSearch aggregator (Google for Jobs → LinkedIn/Indeed/ZipRecruiter/
# Glassdoor/Monster) + ATS feeds (incl. Workday) + TinyFish niche boards.
# API keys go in the .env file (not here).

recency_days: 1            # keep postings <= this many days old (default = last 24h)
require_title_match: true  # drop postings whose title matches none of the patterns
us_empty_location_passes: true   # postings with a blank location still pass the geo gate

# Which markets to keep. A posting's location is mapped to a region; it's
# kept only if that region is listed here (blank locations pass as Unknown).
# Scope is North America: US + Canada. Everything else (UK, India, EU, APAC)
# is rejected.
regions:
  - US
  - Canada
  # - Mexico          # <-- uncomment this one line to also accept Mexican postings
  #                     (detection is already built in; also add "mx" to the
  #                     aggregator countries below to search Mexico on JSearch)

# Safety net for the 24-hour window: a posting the scanner has NEVER seen
# before still passes on first sight if its posted date is within this many
# days — so skipping a day of runs doesn't silently lose 1-2 day-old posts.
first_seen_grace_days: 3

# target_country is legacy (single-market). The multi-region `regions` list
# above is what the geo filter now uses; this is kept only for compatibility.
target_country: US

# Titles keyword list — used to build TinyFish extraction goals and as the
# fallback gate when title_patterns is empty.
titles:
  - property accountant
  - senior property accountant
  - junior property accountant
  - fund accountant
  - senior fund accountant
  - fund controller
  - capital accountant
  - staff accountant
  - accounting manager
  - assistant controller
  - controller

# The keep/drop gate: a posting survives if its title matches ANY regex below
# (case-insensitive) AND matches none of title_exclude_patterns. Covers the
# full set of roles hired by family offices, multifamily operators, CRE
# firms, PE firms, and their back offices. Edit freely; bad patterns are
# skipped with a warning. Employer-type CONTEXT (is this really RE / a family
# office?) is decided later by the classifier, not here.
title_patterns:
  # ── Accounting: property, fund, general, back-office ──
  - '(property|real\s*estate|lease|cam|joint\s*venture|project|development|construction)[\s-]+(management\s+)?account(ant|ing)'
  - 'property\s+management\s+account(ant|ing)'
  - 'payroll\s+account(ant|ing)'
  - 'lease\s+administrat(ion|or)'
  - '(property|fund)\s+controller'
  - '(staff|senior|corporate)\s+accountant'
  - 'accounting\s+manager'
  - 'assistant\s+controller'
  - '(?<!traffic\s)\bcontroller\b'   # plain "Controller" (Air Traffic Controller excluded below)
  - '(fund|investment|portfolio|capital|family\s*office)\s+accountant'
  - 'family\s+office\s+accounting'
  # ── Investment side ──
  - '(acquisitions?|investment|underwriting|financial|development|credit|portfolio|research)\s+analyst'
  - '(investment|acquisitions?|portfolio|asset)\s+associate'
  - 'asset\s+management\s+(analyst|associate)'
  - 'capital\s+markets\s+analyst'
  - '(real\s*estate|cre|multifamily|commercial)\s+underwriter'
  - 'underwrit(er|ing).{0,40}(real\s*estate|cre|multifamily)'
  - 'investor\s+relations(\s+(analyst|associate|manager))?'
  # ── Asset ──
  - 'asset\s+(management\s+)?analyst'
  - 'asset\s+manager'
  # ── Fund operations / back office ──
  - 'fund\s+operations?(\s+(analyst|associate|manager))?'
  - 'fund\s+administrat(or|ion)'
  - '(portfolio|investment)\s+operations'
  - 'treasury\s+analyst'
  - 'financial\s+reporting\s+(analyst|associate|manager)'
  - 'valuations?\s+(analyst|associate|manager)'
  - 'tax\s+(analyst|associate|manager|accountant)'
  - 'compliance\s+(analyst|associate|manager)'
  - '(loan|asset)\s+servicing(\s+(analyst|associate|specialist))?'
  # ── Accounts payable / receivable / billing ──
  - 'accounts?\s+payable'
  - '(accounts?\s+receivable|a/r|billing)\s+(specialist|analyst|coordinator|clerk|accountant)'
  # ── Real-estate operations analysts ──
  - 'lease\s+analyst'
  - 'cam\s+analyst'

# Drop a posting even if a title_pattern above matched. Exclusions always win.
title_exclude_patterns:
  - '\bintern(ship)?s?\b'                              # intern / interns / internship
  - 'air\s+traffic\s+controller'                       # not a finance controller
  - 'insurance.{0,25}underwrit'                        # insurance underwriter (either word order)
  - 'underwrit.{0,25}insurance'
  - '(life|health|auto|motor|casualty|p\s*&\s*c)\s+underwrit'

connectors:

  aggregator:
    enabled: true
    provider: jsearch
    countries:
      - us
      - ca
    queries:
      - property accountant
      - staff accountant
      - senior accountant
      - accounts payable
      - fund accountant
      - controller
      - assistant controller
      - accounting manager
      - real estate accountant
      - corporate accountant
      - property management accountant
      - project accountant
      - construction accountant
      - lease administrator
      - financial reporting analyst
      - fund administrator
      - accounts receivable
      - family office accountant
      - treasury analyst
      - tax accountant
  # ATS feeds — free, no key. ats: greenhouse|lever|ashby|workable|
  # smartrecruiters|workday. For workday, token = the careers-page URL.
  ats:
    enabled: true
    companies: []
      # - { name: "Example REIT", ats: workday, token: "https://example.wd5.myworkdayjobs.com/External" }
      # - { name: "Example PM",   ats: greenhouse, token: "examplepm" }

  # TinyFish — niche boards with no API. LinkedIn searches are location-scoped
  # and use f_TPR=r86400 (posted in the last 24 hours). Scope = US + Canada.
  #
  # Per-role sequential targets, one role per board per target, in PRIORITY
  # ORDER with US/Canada interleaved per role (not all-US-then-all-CA):
  # under a binding step budget the tail of this list never runs, and both
  # geographies of a top role beat one geography of a weak one. LinkedIn
  # gets full 11-role coverage on both markets (it's the volume source and
  # its URL scheme is proven — only the keywords= value changes). Select-
  # Leaders and eFinancialCareers are trimmed to the 4 highest-frequency
  # roles, not the full 11, to bound wall-clock (see BUILD_LOG.md's sizing).
  # Step budgets live in scanner/connectors/tinyfish.py (LINKEDIN_MAX_STEPS=30,
  # SPECIALIST_MAX_STEPS=40, OVERALL_MAX_STEPS=200 by default) — all three
  # are headroom above today's actual counts (22 LinkedIn, 8 specialist), so
  # none of them bind against this list; they exist to bound wall-clock as
  # this list grows later, not to constrain it today.
  tinyfish:
    enabled: true
    targets:
      # ── LinkedIn: full 11-role coverage, US then CA per role ──
      - { name: "LinkedIn US - Property Accountant",           url: "https://www.linkedin.com/jobs/search?keywords=Property%20Accountant&location=United%20States&f_TPR=r86400" }
      # - { name: "LinkedIn Canada - Property Accountant",       url: "https://www.linkedin.com/jobs/search?keywords=Property%20Accountant&location=Canada&f_TPR=r86400" }
      - { name: "LinkedIn US - Fund Accountant",               url: "https://www.linkedin.com/jobs/search?keywords=Fund%20Accountant&location=United%20States&f_TPR=r86400" }
      # - { name: "LinkedIn Canada - Fund Accountant",           url: "https://www.linkedin.com/jobs/search?keywords=Fund%20Accountant&location=Canada&f_TPR=r86400" }
      - { name: "LinkedIn US - Controller",                    url: "https://www.linkedin.com/jobs/search?keywords=Controller&location=United%20States&f_TPR=r86400" }
      # - { name: "LinkedIn Canada - Controller",                url: "https://www.linkedin.com/jobs/search?keywords=Controller&location=Canada&f_TPR=r86400" }
      - { name: "LinkedIn US - Assistant Controller",          url: "https://www.linkedin.com/jobs/search?keywords=Assistant%20Controller&location=United%20States&f_TPR=r86400" }
      # - { name: "LinkedIn Canada - Assistant Controller",      url: "https://www.linkedin.com/jobs/search?keywords=Assistant%20Controller&location=Canada&f_TPR=r86400" }
      - { name: "LinkedIn US - Real Estate Accountant",        url: "https://www.linkedin.com/jobs/search?keywords=Real%20Estate%20Accountant&location=United%20States&f_TPR=r86400" }
      # - { name: "LinkedIn Canada - Real Estate Accountant",    url: "https://www.linkedin.com/jobs/search?keywords=Real%20Estate%20Accountant&location=Canada&f_TPR=r86400" }
      - { name: "LinkedIn US - CAM Analyst",                   url: "https://www.linkedin.com/jobs/search?keywords=CAM%20Analyst&location=United%20States&f_TPR=r86400" }
      # - { name: "LinkedIn Canada - CAM Analyst",               url: "https://www.linkedin.com/jobs/search?keywords=CAM%20Analyst&location=Canada&f_TPR=r86400" }
      - { name: "LinkedIn US - Lease Administrator",           url: "https://www.linkedin.com/jobs/search?keywords=Lease%20Administrator&location=United%20States&f_TPR=r86400" }
      # - { name: "LinkedIn Canada - Lease Administrator",       url: "https://www.linkedin.com/jobs/search?keywords=Lease%20Administrator&location=Canada&f_TPR=r86400" }
      - { name: "LinkedIn US - Lease Analyst",                 url: "https://www.linkedin.com/jobs/search?keywords=Lease%20Analyst&location=United%20States&f_TPR=r86400" }
      # - { name: "LinkedIn Canada - Lease Analyst",             url: "https://www.linkedin.com/jobs/search?keywords=Lease%20Analyst&location=Canada&f_TPR=r86400" }
      - { name: "LinkedIn US - Accounting Manager",            url: "https://www.linkedin.com/jobs/search?keywords=Accounting%20Manager&location=United%20States&f_TPR=r86400" }
      # - { name: "LinkedIn Canada - Accounting Manager",        url: "https://www.linkedin.com/jobs/search?keywords=Accounting%20Manager&location=Canada&f_TPR=r86400" }
      - { name: "LinkedIn US - Acquisitions Analyst",          url: "https://www.linkedin.com/jobs/search?keywords=Acquisitions%20Analyst&location=United%20States&f_TPR=r86400" }
      # - { name: "LinkedIn Canada - Acquisitions Analyst",      url: "https://www.linkedin.com/jobs/search?keywords=Acquisitions%20Analyst&location=Canada&f_TPR=r86400" }
      - { name: "LinkedIn US - Asset Management Analyst",      url: "https://www.linkedin.com/jobs/search?keywords=Asset%20Management%20Analyst&location=United%20States&f_TPR=r86400" }
      # - { name: "LinkedIn Canada - Asset Management Analyst",  url: "https://www.linkedin.com/jobs/search?keywords=Asset%20Management%20Analyst&location=Canada&f_TPR=r86400" }
      # ── SelectLeaders: top 4 roles. No 24h URL filter available (verified
      # keywords= search box, not a category slug), so the pipeline's
      # recency filter (+ first-seen grace) does the cutting, same as before. ──
      - { name: "SelectLeaders - Property Accountant",   url: "https://www.selectleaders.com/jobs/?keywords=Property+Accountant" }
      - { name: "SelectLeaders - Fund Accountant",       url: "https://www.selectleaders.com/jobs/?keywords=Fund+Accountant" }
      - { name: "SelectLeaders - Controller",            url: "https://www.selectleaders.com/jobs/?keywords=Controller" }
      - { name: "SelectLeaders - Accounting Manager",    url: "https://www.selectleaders.com/jobs/?keywords=Accounting+Manager" }
      # ── eFinancialCareers: top 4 roles, same path-segment scheme as the
      # original single target (verified loads 200 for Fund-Accountant only;
      # the other 3 role slugs are NOT independently verified — the site
      # returns HTTP 405 to automated fetch tools, so this could not be
      # checked live). Checked for a server-side date-posted filter param
      # first and could not find one for the same reason (405 on every
      # fetch attempt, including the plain /jobs listing page) — kept the
      # existing no-date-param scheme rather than guess at an unverified
      # parameter. Recency is pipeline-enforced here, same as SelectLeaders. ──
      # ── Disabled (out of North America scope) — re-enable by uncommenting ──
      # - { name: "LinkedIn UK",         url: "https://www.linkedin.com/jobs/search?keywords=Fund%20Accountant&location=United%20Kingdom&f_TPR=r86400" }
      # - { name: "LinkedIn India",      url: "https://www.linkedin.com/jobs/search?keywords=Fund%20Accountant&location=India&f_TPR=r86400" }

# Rule-based classifier — assigns category/subcategory per posting from
# keyword rules applied to title + description + company name. All keyword
# lists live in classifier_rules.yaml — edit that file to tune, not code.
classifier:
  enabled: true
  rules_file: classifier_rules.yaml

# POC (point-of-contact) enrichment — per unique company, via TinyFish, runs
# after clasFsification. A company is looked up ONCE EVER (cached in
# poc_cache.db) — set force_refresh: true for one run to re-look-up
# everything, then set it back to false.
poc_enrichment:
  enabled: false
  cap_per_run: 10          # max NEW companies looked up per run (cached/skipped companies don't count)
  force_refresh: false      # true = ignore the cache and re-look-up every company (costs TinyFish steps)
  cache_db: poc_cache.db
  # Staffing/recruiting firms AND other non-employer professional-services
  # firms (recruiters, CPA/tax practices, consultancies) — always skipped
  # (poc_source = "skipped - staffing firm"), no TinyFish steps spent.
  # Matches if a company name CONTAINS one of these, case-insensitive
  # (e.g. "Vaco" matches "Vaco by Highspring"). You maintain this list —
  # add more any time.
  #
  # Workflow D also applies this as a HARD DROP before the gate (see
  # src/signal_pipeline.py's staffing_blocklist docstring) — none of these
  # is a firm X Analyst can sell embedded staff to, and gating one burns
  # both a Tavily budget slot and a slot out of the daily draft cap.
  #
  # Prefer a FULL, DISTINCTIVE name over a bare descriptive token. Bare
  # "CPA" or "& Associates" would drop real firms, and a bare surname is
  # worse still: family offices are an explicit ICP category and are
  # routinely named after the family, so "Bachrach Group" is listed rather
  # than "Bachrach".
  blocklist:
    - Vaco
    - Staffing
    - Talent
    - Recruit
    - Personnel
    - Search Partners
    - Jobot
    - Metasys
    - SolomonEdwards
    - Hire Score
    - The Lee Group
    - SourcePro
    - Quantum Search
    - Advice Personnel
    - Sherwood
    - Syntax
    - 3 Bridge Networks
    - Atlantic Group
    - LHH
    - Madison-Davis
    - Robert Half
    - Hoxton Circle
    - Frederick Fox
    - Legacy Search Advisors
    - Geneva Search Partners
    - Daley And Associates
    - LaSalle Network
    - Russell Tobin
    - Metric Geo
    - Social Capital Resources
    - E-Frontiers
    - Wall Street Careers
    # ── Added from the run-27 funnel audit ────────────────────────────────
    # These six reached the gate and were each disqualified on firm type
    # after spending 6 Tavily searches. Full names, not tokens: several are
    # surnames or generic words that would over-match on their own.
    - Henderson Harbor Group      # "talent placement for accounting, finance, tax & technology" (its own research)
    - CPA Connections             # CPA/advisory practice. NOT bare "CPA" — that drops real firms
    - Klausner & Company PC       # public accounting firm
    - Susan Fitzgerald & Associates   # government/education consulting. NOT bare "& Associates"
    - LG Legacy Group             # accounting and tax advisory
    - Guidehouse                  # global consultancy
    # Name-shape tokens for recruiters not yet seen by name.
    - Recruiting                  # redundant with "Recruit" above; kept for readability
    - Placement
    - Search Advisors
    # Named recruiters seen in run 25/27 output but not yet blocked.
    - Bachrach Group              # "TBG | The Bachrach Group". NOT bare "Bachrach" — surname
    # -- Added from the run-32 funnel audit --
    # These reached the gate and were each disqualified on firm type or AUM
    # after spending Tavily searches.
    - Aston Carter                # staffing arm of Aerotek/Allegis
    - PrideStaff                  # staffing franchise
    - W3Global                    # IT/eng staffing
    - Executive Alliance          # executive search
    - EisnerAmper                 # accounting and advisory firm
    - Colliers                    # global CRE brokerage, not an owner/operator
    - Corient                     # RIA/wealth manager, AUM far above $2B ceiling
    - ABC Imaging                 # print/imaging services, not RE
    - Blue Origin                 # aerospace, unrelated sector
    - Nichols Contracting         # general contractor, not an owner/operator
    - Insight Global
    - Randstad
    - Kforce
    - Ledgent
    - Camino Search
    - Taurus Search
    - Truity Partners
    - Quest Financial
    - Segrera Associates
    - Orion Placement             # redundant with "Placement" above; kept for readability

# Phone access — off by default (the app only serves 127.0.0.1, this PC).
# Turn on to also install this as an app on your phone: set
# allow_lan_access: true here AND set WEB_APP_PASSWORD in .env (both are
# required — without a password, phone access stays off for safety, since
# turning this on makes the app reachable by every device on your WiFi).
web_app:
  allow_lan_access: false

output:
  csv_path: output/jobs.csv
  seen_db: seen.db
